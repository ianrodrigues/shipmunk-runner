name: Runner checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    # Fork code must never execute on the trusted private runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: pcntl, posix
          coverage: none
      - name: Preload the pinned Linux fixture image
        run: |
          docker pull alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
          docker tag alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc alpine:3.20
      - name: Run standalone checks without accounts
        run: |
          runner_temp=$(mktemp -d "${RUNNER_TEMP}/shipmunk-runner-check.XXXXXX")
          trap 'rm -rf "$runner_temp"' EXIT
          TMPDIR="$runner_temp" make check
